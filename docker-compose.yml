services:
  db:
    image: pgvector/pgvector:pg16
    container_name: retailpulse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retailpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retailpulse_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-retailpulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - retailpulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retailpulse} -d ${POSTGRES_DB:-retailpulse}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  retailpulse_pgdata:
